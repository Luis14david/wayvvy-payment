<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wayvvy Payroll - Ver empleado</title>

    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/verEmpleado.css">
</head>

<body>

    <main class="employee-view-container">

        <header class="topbar">

            <div class="profile-menu">

                <button
                    type="button"
                    class="profile-button"
                    id="profileButton"
                >
                    <span class="profile-avatar">A</span>

                    <span data-i18n="administrador">
                        Administrador
                    </span>

                    <span class="profile-arrow">▼</span>
                </button>

                <div
                    class="profile-dropdown"
                    id="profileDropdown"
                >

                    <a href="#" class="profile-option">
                        Mi perfil
                    </a>

                    <a
                        href="#"
                        class="logout-button profile-logout"
                        data-i18n="cerrarSesion"
                    >
                        Cerrar sesión
                    </a>

                </div>

            </div>

        </header>


        <div class="employee-view-card">

            <div class="employee-view-header">

                <div>
                    <h1 data-i18n="detalleEmpleado">
                        Detalle del empleado
                    </h1>

                    <p data-i18n="infoEmpleado">
                        Información registrada del empleado.
                    </p>
                </div>

                <a
                    href="/html/empleados.html"
                    class="btn-volver"
                    data-i18n="volver"
                >
                    Volver
                </a>

            </div>


            <div class="employee-info-grid">

                <div class="info-item">
                    <span
                        class="info-label"
                        data-i18n="numeroEmpleado"
                    >
                        Número de empleado
                    </span>

                    <span class="info-value" id="numero_empleado">-</span>
                </div>

                <div class="info-item">
                    <span
                        class="info-label"
                        data-i18n="nombreCompleto"
                    >
                        Nombre completo
                    </span>

                    <span class="info-value" id="nombre_completo">-</span>
                </div>

                <div class="info-item">
                    <span class="info-label" data-i18n="cedula">
                        Cédula
                    </span>

                    <span class="info-value" id="cedula">-</span>
                </div>

                <div class="info-item">
                    <span class="info-label" data-i18n="sexo">
                        Sexo
                    </span>

                    <span class="info-value" id="sexo">-</span>
                </div>

                <div class="info-item">
                    <span
                        class="info-label"
                        data-i18n="fechaNacimiento"
                    >
                        Fecha de nacimiento
                    </span>

                    <span class="info-value" id="fecha_nacimiento">-</span>
                </div>

                <div class="info-item">
                    <span class="info-label" data-i18n="telefono">
                        Teléfono
                    </span>

                    <span class="info-value" id="telefono">-</span>
                </div>

                <div class="info-item">
                    <span class="info-label" data-i18n="correo">
                        Correo
                    </span>

                    <span class="info-value" id="correo">-</span>
                </div>

                <div class="info-item">
                    <span class="info-label" data-i18n="direccion">
                        Dirección
                    </span>

                    <span class="info-value" id="direccion">-</span>
                </div>

                <div class="info-item">
                    <span
                        class="info-label"
                        data-i18n="fechaIngreso"
                    >
                        Fecha de ingreso
                    </span>

                    <span class="info-value" id="fecha_ingreso">-</span>
                </div>

                <div class="info-item">
                    <span class="info-label" data-i18n="salarioBase">
                        Salario base
                    </span>

                    <span class="info-value" id="salario_base">-</span>
                </div>

                <div class="info-item">
                    <span class="info-label" data-i18n="puesto">
                        Puesto
                    </span>

                    <span class="info-value" id="puesto">-</span>
                </div>

                <div class="info-item">
                    <span class="info-label" data-i18n="estado">
                        Estado
                    </span>

                    <span class="info-value" id="estado">-</span>
                </div>

            </div>

        </div>

    </main>


    <script src="/js/lang.js"></script>
    <script src="/js/verEmpleado.js"></script>
    <script src="/js/logout.js"></script>

</body>

</html>
