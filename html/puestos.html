<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Wayvvy Payroll - Puestos
    </title>

    <link
        rel="stylesheet"
        href="/css/common.css"
    >

    <link
        rel="stylesheet"
        href="/css/puestos.css"
    >
</head>


<body class="puestos-body">

    <aside class="sidebar">

        <h2>
            WPayroll
        </h2>

        <nav>

            <a
                href="/html/dashboard.html"
                data-i18n="dashboard"
            >
                Dashboard
            </a>

            <a
                href="/html/empleados.html"
                data-i18n="empleados"
            >
                Empleados
            </a>

            <a
                href="/html/nomina.html"
                data-i18n="nomina"
            >
                Nómina
            </a>

            <a
                href="/html/asistencia.html"
                data-i18n="asistencia"
            >
                Asistencia
            </a>

            <a
                href="/html/incentivos.html"
                data-i18n="incentivos"
            >
                Incentivos
            </a>

            <a
                href="/html/reportes.html"
                data-i18n="reportes"
            >
                Reportes
            </a>

            <a
                href="/html/puestos.html"
                class="active"
                aria-current="page"
                data-i18n="puestos"
            >
                Puestos
            </a>

            <a
                href="/html/configuracion.html"
                data-i18n="configuracion"
            >
                Configuración
            </a>

            <div class="language-switch">

                <button
                    type="button"
                    class="language-button"
                    onclick="cambiarIdioma('es')"
                >
                    ES
                </button>

                <span>
                    |
                </span>

                <button
                    type="button"
                    class="language-button"
                    onclick="cambiarIdioma('en')"
                >
                    EN
                </button>

            </div>

            <a
                href="#"
                class="logout-button sidebar-logout"
                data-i18n="cerrarSesion"
            >
                Cerrar sesión
            </a>

        </nav>

    </aside>


    <main class="puestos-content">

        <header class="topbar">

            <div class="profile-menu">

                <button
                    class="profile-button"
                    id="profileButton"
                    type="button"
                >

                    <span class="profile-avatar">
                        A
                    </span>

                    <span data-i18n="administrador">
                        Administrador
                    </span>

                    <span class="profile-arrow">
                        ▼
                    </span>

                </button>

                <div
                    class="profile-dropdown"
                    id="profileDropdown"
                >

                    <a
                        href="#"
                        class="profile-option"
                    >
                        Mi perfil
                    </a>

                    <a
                        href="#"
                        class="logout-button profile-logout"
                        data-i18n="cerrarSesion"
                    >
                        Cerrar sesión
                    </a>

                </div>

            </div>

        </header>


        <div class="puestos-header">

            <div>

                <h1 data-i18n="puestos">
                    Puestos
                </h1>

                <p data-i18n="administracionPuestos">
                    Administración de puestos de trabajo.
                </p>

            </div>

        </div>


        <section class="puesto-form-card">

            <h2 data-i18n="nuevoPuesto">
                Nuevo puesto
            </h2>

            <form id="puestoForm">

                <div class="form-group">

                    <label
                        for="nombre_puesto"
                        data-i18n="nombrePuesto"
                    >
                        Nombre del puesto
                    </label>

                    <input
                        type="text"
                        id="nombre_puesto"
                        name="nombre_puesto"
                        required
                    >

                </div>


                <div class="form-group">

                    <label
                        for="descripcion"
                        data-i18n="descripcion"
                    >
                        Descripción
                    </label>

                    <textarea
                        id="descripcion"
                        name="descripcion"
                        rows="4"
                        required
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="btn-guardar"
                    data-i18n="guardarPuesto"
                >
                    Guardar puesto
                </button>

                <button
                    type="button"
                    class="btn-cancelar-edicion"
                    id="btnCancelarEdicion"
                    style="display: none;"
                    data-i18n="cancelarEdicion"
                >
                    Cancelar edición
                </button>

            </form>

        </section>


        <section class="puestos-lista-card">

            <div class="puestos-lista-header">

                <h2 data-i18n="puestosRegistrados">
                    Puestos registrados
                </h2>

            </div>

            <div class="puestos-table-container">

                <table class="puestos-table">

                    <thead>

                        <tr>

                            <th scope="col">
                                ID
                            </th>

                            <th scope="col" data-i18n="puesto">
                                Puesto
                            </th>

                            <th scope="col" data-i18n="descripcion">
                                Descripción
                            </th>

                            <th scope="col" data-i18n="acciones">
                                Acciones
                            </th>

                        </tr>

                    </thead>

                    <tbody id="puestosBody">

                        <tr>

                            <td
                                colspan="4"
                                data-i18n="cargandoPuestos"
                            >
                                Cargando puestos...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="/js/lang.js"></script>

    <script src="/js/puestos.js"></script>

    <script src="/js/logout.js"></script>

</body>

</html>
