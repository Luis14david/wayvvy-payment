<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Reportes - Wayvvy Payroll
    </title>

    <link
        rel="stylesheet"
        href="/css/common.css"
    >

    <link
        rel="stylesheet"
        href="/css/reportes.css"
    >
</head>


<body class="dashboard-body">

    <aside class="sidebar">

        <h2>
            WPayroll
        </h2>

        <nav>

            <a
                href="/html/dashboard.html"
                data-i18n="dashboard"
            >
                Dashboard
            </a>

            <a
                href="/html/empleados.html"
                data-i18n="empleados"
            >
                Empleados
            </a>

            <a
                href="/html/nomina.html"
                data-i18n="nomina"
            >
                Nómina
            </a>

            <a
                href="/html/asistencia.html"
                data-i18n="asistencia"
            >
                Asistencia
            </a>

            <a
                href="/html/incentivos.html"
                data-i18n="incentivos"
            >
                Incentivos
            </a>

            <a
                href="/html/reportes.html"
                class="active"
                aria-current="page"
                data-i18n="reportes"
            >
                Reportes
            </a>

            <a
                href="/html/puestos.html"
                data-i18n="puestos"
            >
                Puestos
            </a>

            <a
                href="/html/configuracion.html"
                data-i18n="configuracion"
            >
                Configuración
            </a>

            <div class="language-switch">

                <button
                    type="button"
                    class="language-button"
                    onclick="cambiarIdioma('es')"
                >
                    ES
                </button>

                <span>|</span>

                <button
                    type="button"
                    class="language-button"
                    onclick="cambiarIdioma('en')"
                >
                    EN
                </button>

            </div>

            <a
                href="#"
                class="logout-button sidebar-logout"
                data-i18n="cerrarSesion"
            >
                Cerrar sesión
            </a>

        </nav>

    </aside>


    <main class="dashboard-content">

        <header class="topbar">

            <div class="profile-menu">

                <button
                    class="profile-button"
                    id="profileButton"
                    type="button"
                >

                    <span class="profile-avatar">
                        A
                    </span>

                    <span data-i18n="administrador">
                        Administrador
                    </span>

                    <span class="profile-arrow">
                        ▼
                    </span>

                </button>

                <div
                    class="profile-dropdown"
                    id="profileDropdown"
                >

                    <a
                        href="#"
                        class="logout-button profile-logout"
                        data-i18n="cerrarSesion"
                    >
                        Cerrar sesión
                    </a>

                </div>

            </div>

        </header>


        <div class="reportes-header">

            <div>

                <h1 data-i18n="reportes">
                    Reportes
                </h1>

                <p data-i18n="gestionReportes">
                    Gestión de reportes
                </p>

            </div>

        </div>


        <section class="reportes-card">

            <div class="reportes-tipos">

                <button
                    type="button"
                    class="reporte-tipo-btn active"
                    id="btnReporteHoras"
                    data-i18n="reporteHoras"
                >
                    Reporte de horas
                </button>

                <button
                    type="button"
                    class="reporte-tipo-btn"
                    id="btnComprobantePago"
                    data-i18n="comprobantePago"
                >
                    Comprobante de pago
                </button>

            </div>


            <h2
                id="tituloTipoReporte"
                data-i18n="reporteHoras"
            >
                Reporte de horas
            </h2>


            <div class="reportes-filtros">

                <div class="form-group">

                    <label
                        for="empleadoReporte"
                        data-i18n="empleadoReporte"
                    >
                        Empleado
                    </label>

                    <select id="empleadoReporte">

                        <option
                            value="todos"
                            data-i18n="todosEmpleados"
                        >
                            Todos los empleados
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label
                        for="reporteDesde"
                        data-i18n="desdeReporte"
                    >
                        Desde
                    </label>

                    <div class="date-picker-group">

                        <input
                            type="date"
                            id="reporteDesde"
                        >

                        <button
                            type="button"
                            class="btn-calendar"
                            id="btnCalendarioReporteDesde"
                            title="Seleccionar fecha inicial"
                            aria-label="Seleccionar fecha inicial"
                        >
                            📅
                        </button>

                    </div>

                </div>


                <div class="form-group">

                    <label
                        for="reporteHasta"
                        data-i18n="hastaReporte"
                    >
                        Hasta
                    </label>

                    <div class="date-picker-group">

                        <input
                            type="date"
                            id="reporteHasta"
                        >

                        <button
                            type="button"
                            class="btn-calendar"
                            id="btnCalendarioReporteHasta"
                            title="Seleccionar fecha final"
                            aria-label="Seleccionar fecha final"
                        >
                            📅
                        </button>

                    </div>

                </div>


                <button
                    type="button"
                    class="btn-guardar"
                    id="btnGenerarReporte"
                    data-i18n="generarReporte"
                >
                    Generar reporte
                </button>

            </div>


            <div
                class="reporte-resultados"
                id="reporteResultados"
            >
            </div>

        </section>

    </main>


    <script src="/js/lang.js"></script>

    <script src="/js/logout.js"></script>

    <script src="/js/reportes.js"></script>

</body>

</html>
