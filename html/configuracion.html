<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wayvvy Payroll - Configuración</title>

    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/configuracion.css">
</head>

<body class="dashboard-body">

    <aside class="sidebar">

        <h2>Wayvvy Payroll</h2>

        <nav>

            <a href="/html/dashboard.html" data-i18n="dashboard">
                Dashboard
            </a>

            <a href="/html/empleados.html" data-i18n="empleados">
                Empleados
            </a>

            <a href="/html/nomina.html" data-i18n="nomina">
                Nómina
            </a>

            <a href="/html/asistencia.html" data-i18n="asistencia">
                Asistencia
            </a>

            <a href="/html/incentivos.html" data-i18n="incentivos">
                Incentivos
            </a>

            <a href="/html/reportes.html" data-i18n="reportes">
                Reportes
            </a>

            <a href="/html/puestos.html" data-i18n="puestos">
                Puestos
            </a>

            <a
                href="/html/configuracion.html"
                class="active"
                aria-current="page"
                data-i18n="configuracion"
            >
                Configuración
            </a>

            <div class="language-switch">

                <button
                    type="button"
                    class="language-button"
                    onclick="cambiarIdioma('es')"
                >
                    ES
                </button>

                <span>|</span>

                <button
                    type="button"
                    class="language-button"
                    onclick="cambiarIdioma('en')"
                >
                    EN
                </button>

            </div>

            <a
                href="#"
                class="logout-button sidebar-logout"
                data-i18n="cerrarSesion"
            >
                Cerrar sesión
            </a>

        </nav>

    </aside>


    <main class="dashboard-content">

        <header class="topbar">

            <div class="profile-menu">

                <button
                    type="button"
                    class="profile-button"
                    id="profileButton"
                >
                    <span class="profile-avatar">A</span>

                    <span data-i18n="administrador">
                        Administrador
                    </span>

                    <span class="profile-arrow">▼</span>
                </button>

                <div
                    class="profile-dropdown"
                    id="profileDropdown"
                >

                    <a href="#" class="profile-option">
                        Mi perfil
                    </a>

                    <a
                        href="#"
                        class="logout-button profile-logout"
                        data-i18n="cerrarSesion"
                    >
                        Cerrar sesión
                    </a>

                </div>

            </div>

        </header>


        <h1 data-i18n="configuracion">
            Configuración
        </h1>

        <label for="imagenPerfil">
            Imagen de perfil
        </label>

        <input
            type="file"
            id="imagenPerfil"
            accept="image/*"
        >

    </main>


    <script src="/js/lang.js"></script>
    <script src="/js/logout.js"></script>

</body>

</html>
