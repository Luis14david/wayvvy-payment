<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        WPayroll - Empleados
    </title>

    <link
        rel="stylesheet"
        href="/css/common.css"
    >

    <link
        rel="stylesheet"
        href="/css/empleados.css"
    >

</head>


<body class="dashboard-body">

    <aside class="sidebar">

        <h2>
            WPayroll
        </h2>

        <nav>

            <a
                href="/html/dashboard.html"
                data-i18n="dashboard"
            >
                Dashboard
            </a>

            <a
                href="/html/empleados.html"
                class="active"
                aria-current="page"
                data-i18n="empleados"
            >
                Empleados
            </a>

            <a
                href="/html/nomina.html"
                data-i18n="nomina"
            >
                Nómina
            </a>

            <a
                href="/html/asistencia.html"
                data-i18n="asistencia"
            >
                Asistencia
            </a>

            <a
                href="/html/incentivos.html"
                data-i18n="incentivos"
            >
                Incentivos
            </a>

            <a
                href="/html/reportes.html"
                data-i18n="reportes"
            >
                Reportes
            </a>

            <a
                href="/html/puestos.html"
                data-i18n="puestos"
            >
                Puestos
            </a>

            <a
                href="/html/configuracion.html"
                data-i18n="configuracion"
            >
                Configuración
            </a>

            <div class="language-switch">

                <button
                    type="button"
                    class="language-button"
                    onclick="cambiarIdioma('es')"
                >
                    ES
                </button>

                <span>|</span>

                <button
                    type="button"
                    class="language-button"
                    onclick="cambiarIdioma('en')"
                >
                    EN
                </button>

            </div>

            <a
                href="#"
                class="logout-button sidebar-logout"
                data-i18n="cerrarSesion"
            >
                Cerrar sesión
            </a>

        </nav>

    </aside>


    <main class="employees-content">

        <header class="topbar">

            <div class="profile-menu">

                <button
                    class="profile-button"
                    id="profileButton"
                    type="button"
                >

                    <span class="profile-avatar">
                        A
                    </span>

                    <span data-i18n="administrador">
                        Administrador
                    </span>

                    <span class="profile-arrow">
                        ▼
                    </span>

                </button>

                <div
                    class="profile-dropdown"
                    id="profileDropdown"
                >

                    <a
                        href="#"
                        class="profile-option"
                    >
                        Mi perfil
                    </a>

                    <a
                        href="#"
                        class="logout-button profile-logout"
                        data-i18n="cerrarSesion"
                    >
                        Cerrar sesión
                    </a>

                </div>

            </div>

        </header>


        <div class="employees-header">

            <div>

                <h1 data-i18n="empleados">
                    Empleados
                </h1>

                <p data-i18n="gestionEmpleados">
                    Gestión de empleados registrados.
                </p>

            </div>

            <a
                href="/html/ingresoDeEmpleado.html"
                class="btn-new-employee"
            >

                <span class="plus-icon">
                    +
                </span>

                <span data-i18n="nuevoEmpleado">
                    Nuevo empleado
                </span>

            </a>

        </div>


        <div class="employees-card">

            <div class="table-header">

                <h2>
                    Lista de empleados
                </h2>

                <input
                    type="text"
                    id="buscarEmpleado"
                    class="employee-search"
                    placeholder="Buscar empleado..."
                    aria-label="Buscar empleado"
                    autocomplete="off"
                >

            </div>

            <table class="employees-table">

                <thead>

                    <tr>

                        <th scope="col" data-i18n="numero">
                            No.
                        </th>

                        <th scope="col" data-i18n="empleado">
                            Empleado
                        </th>

                        <th scope="col" data-i18n="cedula">
                            Cédula
                        </th>

                        <th scope="col" data-i18n="puesto">
                            Puesto
                        </th>

                        <th scope="col" data-i18n="fechaIngreso">
                            Fecha de ingreso
                        </th>

                        <th scope="col" data-i18n="estado">
                            Estado
                        </th>

                        <th scope="col" data-i18n="acciones">
                            Acciones
                        </th>

                    </tr>

                </thead>

                <tbody id="empleadosBody">
                </tbody>

            </table>

        </div>

    </main>


    <script src="/js/lang.js"></script>

    <script src="/js/empleados.js"></script>

    <script src="/js/logout.js"></script>

</body>

</html>
