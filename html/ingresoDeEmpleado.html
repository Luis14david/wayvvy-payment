<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wayvvy Payroll - Ingreso de empleado</title>

    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/ingresoEmpleado.css">
</head>

<body>

    <div class="employee-language-switch">

        <button
            type="button"
            onclick="cambiarIdioma('es')"
        >
            ES
        </button>

        <span>|</span>

        <button
            type="button"
            onclick="cambiarIdioma('en')"
        >
            EN
        </button>

    </div>


    <form action="/registrar" method="POST" class="employee-form">

        <div class="form-group">

            <label for="nombres" data-i18n="nombre">
                Nombre
            </label>

            <div class="input-container">
                <input type="text" id="nombres" name="nombres">
                <span class="error-icon" id="errorNombre"></span>
            </div>

        </div>


        <div class="form-group">

            <label for="apellidos" data-i18n="apellido">
                Apellido
            </label>

            <div class="input-container">
                <input type="text" id="apellidos" name="apellidos">
                <span class="error-icon" id="errorApellido"></span>
            </div>

        </div>


        <div class="form-group">

            <label for="cedula" data-i18n="cedulaFormulario">
                Cédula
            </label>

            <div class="input-container">
                <input type="text" id="cedula" name="cedula">
                <span class="error-icon" id="errorCedula"></span>
            </div>

        </div>


        <div class="form-group">

            <label for="sexo" data-i18n="sexoFormulario">
                Sexo
            </label>

            <div class="input-container">
                <input type="text" id="sexo" name="sexo">
                <span class="error-icon" id="errorSexo"></span>
            </div>

        </div>


        <div class="form-group">

            <label for="nacimiento" data-i18n="fechaNacimientoFormulario">
                Fecha de nacimiento
            </label>

            <div class="input-container">
                <input type="date" id="nacimiento" name="nacimiento">
                <span class="error-icon" id="errorFechaDeNacimiento"></span>
            </div>

        </div>


        <div class="form-group">

            <label for="telefono" data-i18n="telefonoFormulario">
                Teléfono
            </label>

            <div class="input-container">

                <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    placeholder="Ej: 809-555-1234"
                    data-i18n-placeholder="telefonoPlaceholder"
                >

                <span class="error-icon" id="errorTelefono"></span>

            </div>

        </div>


        <div class="form-group">

            <label for="correo" data-i18n="correoElectronico">
                Correo electrónico
            </label>

            <div class="input-container">

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="ejemplo@correo.com"
                    data-i18n-placeholder="correoPlaceholder"
                >

                <span class="error-icon" id="errorCorreo"></span>

            </div>

        </div>


        <div class="form-group">

            <label for="direccion" data-i18n="direccionFormulario">
                Dirección
            </label>

            <div class="input-container">

                <input
                    type="text"
                    id="direccion"
                    name="direccion"
                    placeholder="Calle, número, ciudad"
                    data-i18n-placeholder="direccionPlaceholder"
                >

                <span class="error-icon" id="errorDireccion"></span>

            </div>

        </div>


        <div class="form-group">

            <label for="fecha_ingreso" data-i18n="fechaIngresoFormulario">
                Fecha de ingreso
            </label>

            <div class="input-container">
                <input type="date" id="fecha_ingreso" name="fecha_ingreso">
                <span class="error-icon" id="errorFechaIngreso"></span>
            </div>

        </div>


        <div class="form-group">

            <label for="salario_base">
                Tarifa por hora (RD$)
            </label>

            <div class="input-container">

                <input
                    type="number"
                    id="salario_base"
                    name="salario_base"
                    min="0.01"
                    max="99999999.99"
                    required
                    step="0.01"
                    placeholder="0.00"
                >

                <span class="error-icon" id="errorSalarioBase"></span>

            </div>

        </div>


        <div class="form-group">

            <label for="id_puesto" data-i18n="puestoFormulario">
                Puesto
            </label>

            <div class="input-container">

                <select id="id_puesto" name="id_puesto">
                    <option value="" data-i18n="seleccionarPuesto">
                        Seleccione un puesto...
                    </option>
                </select>

                <span class="error-icon" id="errorIdPuesto"></span>

            </div>

        </div>


        <div class="form-group">

            <label for="estado" data-i18n="estadoFormulario">
                Estado
            </label>

            <div class="input-container">

                <select id="estado" name="estado" required>
                    <option value="" data-i18n="seleccionarEstado">
                        Seleccione un estado...
                    </option>
                </select>

                <span class="error-icon" id="errorEstado"></span>

            </div>

        </div>


        
        <!-- Vigencia de la tarifa por hora -->
        <div class="form-group" id="grupoNuevaTarifa" hidden>
            <label for="nueva_tarifa">Nueva tarifa por hora (RD$)</label>
            <div class="input-container">
                <input type="number" id="nueva_tarifa" name="nueva_tarifa" min="0.01" max="99999999.99" step="0.01" placeholder="Dejar vacío si no cambia">
            </div>
        </div>
        <div class="form-group">
            <label for="fecha_tarifa">Tarifa vigente desde</label>
            <div class="input-container">
                <input type="date" id="fecha_tarifa" name="fecha_tarifa" min="2026-08-25" required>
            </div>
        </div>
        <div class="form-group" id="grupoMotivoTarifa" hidden>
            <label for="motivo_tarifa">Motivo del cambio de tarifa</label>
            <div class="input-container">
                <input type="text" id="motivo_tarifa" name="motivo_tarifa" maxlength="255">
            </div>
        </div>
        <section class="historial-tarifas" id="historialTarifas" hidden>
            <h2>Historial de tarifas por hora</h2>
            <p id="estadoTarifas" role="status"></p>
            <div class="tabla-tarifas">
                <table>
                    <thead><tr><th>Vigente desde</th><th>RD$ por hora</th><th>Motivo</th></tr></thead>
                    <tbody id="tarifasBody"></tbody>
                </table>
            </div>
        </section>

<div class="form-actions">

            <a
                href="/html/empleados.html"
                class="btn-cancelar"
                id="btnCancelar"
                data-i18n="cancelar"
            >
                Cancelar
            </a>

            <button
                type="submit"
                class="btn-agregar"
                data-i18n="agregarEmpleado"
            >
                Agregar empleado
            </button>

        </div>

    </form>


    <script src="/js/lang.js"></script>
    <script src="/js/ingresoEmpleado.js"></script>

</body>

</html>
