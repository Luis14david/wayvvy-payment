<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wayvvy Payroll - Ver empleado</title>

    <link rel="stylesheet" href="css/verEmpleado.css">
    <link rel="stylesheet" href="css/common.css">
</head>

<body>

    <main class="employee-view-container">

        <header class="topbar">

    <div class="profile-menu">

        <button class="profile-button" id="profileButton">
            <span class="profile-avatar">A</span>
            <span>Administrador</span>
            <span class="profile-arrow">▼</span>
        </button>

        <div class="profile-dropdown" id="profileDropdown">

            <a href="#" class="profile-option">
                Mi perfil
            </a>

            <a href="#" class="logout-button profile-logout">
                Cerrar sesión
            </a>

        </div>

    </div>

</header>

        <div class="employee-view-card">

            <div class="employee-view-header">
                <div>
                    <h1>Información del empleado</h1>
                    <p>Detalles registrados en Wayvvy Payroll.</p>
                </div>

                <a href="empleados.html" class="btn-volver">
                    Volver
                </a>
            </div>

            <div class="employee-info-grid">

                <div class="info-item">
                    <span class="info-label">Número de empleado</span>
                    <span class="info-value" id="numero_empleado">-</span>
                </div>

                <div class="info-item">
                    <span class="info-label">Nombre</span>
                    <span class="info-value" id="nombre_completo">-</span>
                </div>

                <div class="info-item">
                    <span class="info-label">Cédula</span>
                    <span class="info-value" id="cedula">-</span>
                </div>

                <div class="info-item">
                    <span class="info-label">Sexo</span>
                    <span class="info-value" id="sexo">-</span>
                </div>

                <div class="info-item">
                    <span class="info-label">Fecha de nacimiento</span>
                    <span class="info-value" id="fecha_nacimiento">-</span>
                </div>

                <div class="info-item">
                    <span class="info-label">Teléfono</span>
                    <span class="info-value" id="telefono">-</span>
                </div>

                <div class="info-item">
                    <span class="info-label">Correo</span>
                    <span class="info-value" id="correo">-</span>
                </div>

                <div class="info-item">
                    <span class="info-label">Dirección</span>
                    <span class="info-value" id="direccion">-</span>
                </div>

                <div class="info-item">
                    <span class="info-label">Fecha de ingreso</span>
                    <span class="info-value" id="fecha_ingreso">-</span>
                </div>

                <div class="info-item">
                    <span class="info-label">Salario base</span>
                    <span class="info-value" id="salario_base">-</span>
                </div>

                <div class="info-item">
                    <span class="info-label">Puesto</span>
                    <span class="info-value" id="puesto">-</span>
                </div>

                <div class="info-item">
                    <span class="info-label">Estado</span>
                    <span class="info-value" id="estado">-</span>
                </div>

            </div>

        </div>

    </main>

    <script src="js/verEmpleado.js"></script>
<script src="js/logout.js"></script>

</body>

</html>
