<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wayvvy Payroll - Empleados</title>

    <link rel="stylesheet" href="css/empleados.css">
    <link rel="stylesheet" href="css/common.css">
</head>

<body class="dashboard-body">

    <aside class="sidebar">

        <h2>Wayvvy Payroll</h2>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="empleados.html" class="active">Empleados</a>
            <a href="#">Nómina</a>
            <a href="#">Asistencia</a>
            <a href="#">Incentivos</a>
            <a href="#">Reportes</a>
            <a href="puestos.html">Puestos</a>
            <a href="#">Configuración</a>
            <a href="#" class="logout-button sidebar-logout">Cerrar sesión</a>
        </nav>

    </aside>

    <main class="employees-content">

        <header class="topbar">

    <div class="profile-menu">

        <button class="profile-button" id="profileButton">
            <span class="profile-avatar">A</span>
            <span>Administrador</span>
            <span class="profile-arrow">▼</span>
        </button>

        <div class="profile-dropdown" id="profileDropdown">

            <a href="#" class="profile-option">
                Mi perfil
            </a>

            <a href="#" class="logout-button profile-logout">
                Cerrar sesión
            </a>

        </div>

    </div>

</header>

        <div class="employees-header">

            <div>
                <h1>Empleados</h1>
                <p>Gestión del personal registrado en Wayvvy Payments.</p>
            </div>

            <a href="ingresoDeEmpleado.html" class="btn-new-employee">
    <span class="plus-icon">+</span>
    <span>Nuevo empleado</span>
</a>

        </div>


        <div class="employees-card">

            <div class="table-header">

                <h2>Lista de empleados</h2>

                <input
                    type="text"
                    placeholder="Buscar empleado..."
                    class="employee-search"
                >

            </div>


            <table class="employees-table">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Empleado</th>
                        <th>Cédula</th>
                        <th>Puesto</th>
                        <th>Fecha ingreso</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody id="empleadosBody">

</tbody>

            </table>

        </div>

    </main>
<script src="js/empleados.js"></script>
<script src="js/logout.js"></script>

</body>
</html>

</html>
