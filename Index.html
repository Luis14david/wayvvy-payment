<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wayvvy Payroll - Iniciar sesión</title>

    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/login.css">
</head>

<body>

    <div class="login-container">

        <img
            src="/Images/logo-wayvvy.png"
            alt="Logo Wayvvy Payments"
            class="logo"
        >

        <form class="login-form" id="loginForm">

            <label for="usuario">
                Usuario
            </label>

            <div class="input-container">

                <input
                    type="text"
                    id="usuario"
                    autocomplete="username"
                >

                <span class="error-icon" id="errorUsuario">
                    !
                </span>

            </div>


            <label for="password">
                Contraseña
            </label>

            <div class="input-container">

                <input
                    type="password"
                    id="password"
                    autocomplete="current-password"
                >

                <span class="error-icon" id="errorPassword">
                    !
                </span>

            </div>


            <a href="#" class="forgot-password">
                ¿Olvidaste tu contraseña?
            </a>

            <button type="submit">
                Iniciar sesión
            </button>

            <p id="mensaje" aria-live="polite"></p>

        </form>

    </div>


    <script src="/js/script.js"></script>

</body>

</html>
