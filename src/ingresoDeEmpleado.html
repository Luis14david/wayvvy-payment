<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Wayvvy Payments - Ingreso Nuevo Usuario</title>

    <link rel="stylesheet" href="css/ingresoEmpleado.css">
</head>

<body>

    <div class="login-container">


    <form action="/registrar" method="POST" class="employee-form">

        <div class="form-group">
    <label for="nombres">Nombre</label>
    <div class="input-container">
        <input type="text" id="nombres" name="nombres">
        <span class="error-icon" id="errorNombre"></span>
    </div>
</div>

    <div class="form-group">
    <label for="apellidos">Apellido</label>
    <div class="input-container">
        <input type="text" id="apellidos" name="apellidos">
        <span class="error-icon" id="errorApellido"></span>
    </div>
</div>

    <div class="form-group">
    <label for="cedula">Cedula</label>
    <div class="input-container">
        <input type="text" id="cedula" name="cedula">
        <span class="error-icon" id="errorCedula"></span>
    </div>
</div>

<div class="form-group">
    <label for="sexo">Sexo</label>
    <div class="input-container">
        <input type="text" id="sexo" name="sexo">
        <span class="error-icon" id="errorSexo"></span>
    </div>
</div>

<div class="form-group">
    <label for="nacimiento">Fecha de nacimiento</label>
    <div class="input-container">
        <input type="date" id="nacimiento" name="nacimiento">
        <span class="error-icon" id="errorFechaDeNacimiento"></span>
    </div>
</div>

<div class="form-group">
    <label for="telefono">Teléfono</label>
    <div class="input-container">
        <input type="tel" id="telefono" name="telefono" placeholder="Ej: 809-555-1234">
        <span class="error-icon" id="errorTelefono"></span>
    </div>
</div>

<div class="form-group">
    <label for="correo">Correo electrónico</label>
    <div class="input-container">
        <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com">
        <span class="error-icon" id="errorCorreo"></span>
    </div>
</div>

<div class="form-group">
    <label for="direccion">Dirección</label>
    <div class="input-container">
        <input type="text" id="direccion" name="direccion" placeholder="Calle, número, ciudad">
        <span class="error-icon" id="errorDireccion"></span>
    </div>
</div>

<div class="form-group">
    <label for="fecha_ingreso">Fecha de ingreso</label>
    <div class="input-container">
        <input type="date" id="fecha_ingreso" name="fecha_ingreso">
        <span class="error-icon" id="errorFechaIngreso"></span>
    </div>
</div>

<div class="form-group">
    <label for="salario_base">Salario base</label>
    <div class="input-container">
        <input type="number" id="salario_base" name="salario_base" step="0.01" placeholder="0.00">
        <span class="error-icon" id="errorSalarioBase"></span>
    </div>
</div>

<div class="form-group">
    <label for="id_puesto">Puesto</label>

    <div class="input-container">
        <select id="id_puesto" name="id_puesto">
            <option value="">Seleccione un puesto...</option>
        </select>

        <span class="error-icon" id="errorIdPuesto"></span>
    </div>
</div>
<div class="form-group">
    <label for="estado">Estado</label>

    <div class="input-container">
        <select id="estado" name="estado">
            <option value="">Seleccione...</option>
            <option value="activo">Activo</option>
            <option value="inactivo">Inactivo</option>
            <option value="suspendido">Suspendido</option>
        </select>
        <span class="error-icon" id="errorEstado"></span>
    </div>
</div>


    <div class="form-actions">

    <a href="empleados.html" class="btn-cancelar" id="btnCancelar">
    Cancelar
</a>

    <button type="submit" class="btn-agregar">
        Agregar empleado
    </button>

</div>

</form>

</div>

<script src="js/ingresoEmpleado.js"></script>

</body>
</html>
